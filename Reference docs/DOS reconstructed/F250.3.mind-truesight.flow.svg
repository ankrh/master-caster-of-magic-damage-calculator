<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="540" viewBox="0 0 1060 540"><style>text{font-family:Segoe UI,Arial;fill:#172b42;font-size:17px}.title{font-size:25px;font-weight:600}.box{fill:#eaf2fb;stroke:#4875a3;stroke-width:2}.call{fill:#fff3dd;stroke:#ae7629;stroke-width:2}.line{stroke:#4875a3;stroke-width:2;fill:none}</style><rect width="1060" height="540" fill="#fff"/><text class="title" x="35" y="40">DOS combat writers: distinct battle fields, three builds</text><text x="35" y="71">Named Mind Storm / True Sight routes remain conditional on runtime record binding.</text><rect class="box" x="35" y="100" width="460" height="90" rx="10"/><text x="55" y="127">Class 14 — local guards before call/store</text><text x="55" y="154">Attribs_1 Magic → saved realm test → Illusion</text><text x="55" y="178">Mind Storm: Sorcery/Illusion guard in all 3 builds</text><rect class="box" x="565" y="100" width="460" height="90" rx="10"/><text x="585" y="132">Classes 1 / 15 — no local pre-call guard</text><text x="585" y="164">True Sight uses ordinary flag-pair path</text><path class="line" d="M265 190v25 M795 190v25"/><rect class="call" x="75" y="215" width="380" height="50" rx="8"/><rect class="call" x="605" y="215" width="380" height="50" rx="8"/><text x="104" y="247">Opaque call 0418:0043</text><text x="635" y="247">Opaque call 0418:0043</text><path class="line" d="M265 265v25 M795 265v25"/><rect class="box" x="35" y="290" width="460" height="85" rx="10"/><text x="55" y="321">Battle Combat_Effects OR spell low mask</text><text x="55" y="350">0x82520 · Mind Storm mask 0x0008</text><rect class="box" x="565" y="290" width="460" height="85" rx="10"/><text x="585" y="321">Battle enchantment words: +0x3C then +0x3A</text><text x="585" y="350">0x826B1 / 0x826B6 · True Sight high mask 0x40</text><path class="line" d="M265 375v25 M795 375v25"/><rect class="call" x="35" y="400" width="990" height="78" rx="10"/><text x="55" y="431">Post-store calls: 1.31 / 1.60 retain byte/frame tails; CoM skips those tails.</text><text x="55" y="458">Opaque callees do not establish universal recalculation, preserved values or permanent writeback.</text><text x="35" y="515">Special sibling branches are retained in combat.c; known consumers and class13/16 store are reused.</text></svg>