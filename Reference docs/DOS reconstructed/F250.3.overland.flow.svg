<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7792ad"/></marker></defs><rect width="1120" height="860" fill="#0d1826"/><g font-family="Segoe UI, sans-serif" fill="#e7eff8"><text x="30" y="38" font-size="27" fill="#e7eff8">DOS overland True Sight: writer and local continuation</text><text x="30" y="67" font-size="16" fill="#a8bfd4">F250.3 · 373 instructions · requested entry DI=131 · full-pass equivalence unproved</text><rect x="220" y="95" width="680" height="125" rx="10" fill="#1b3044" stroke="#48627c"/><text x="238" y="124" font-size="20" fill="#e7eff8">All three builds: permanent enchantment carrier</text><text x="238" y="151" font-size="16" fill="#e7eff8">Read old high/low words; OR live spell masks; reload unit address.</text><text x="238" y="174" font-size="16" fill="#e7eff8">B3714: write high +1A → B3718: write low +18.</text><text x="238" y="197" font-size="16" fill="#e7eff8">Raw True Sight mask 00400000 applies if loaded bytes match.</text><path d="M400,220 L280,250" stroke="#7792ad" fill="none" stroke-width="2" marker-end="url(#arrow)"/><path d="M720,220 L835,250" stroke="#7792ad" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="250" width="500" height="145" rx="10" fill="#1b3044" stroke="#48627c"/><text x="48" y="279" font-size="20" fill="#e7eff8">MoM 1.31 / CP 1.60</text><text x="48" y="306" font-size="16" fill="#e7eff8">Requested spell skips neighboring special cases.</text><text x="48" y="329" font-size="16" fill="#e7eff8">Optional pretested wizard scan → live spell kind 2 or 4</text><text x="48" y="352" font-size="16" fill="#e7eff8">may call A6061. Raw kind 3 would exclude this call.</text><text x="48" y="375" font-size="16" fill="#e7eff8">No admission / loader proof is inferred.</text><rect x="575" y="250" width="515" height="145" rx="10" fill="#1b3044" stroke="#48627c"/><text x="593" y="279" font-size="20" fill="#e7eff8">CoM1 6.08</text><text x="593" y="306" font-size="16" fill="#e7eff8">Conditional Create Outpost type gate clears unit Status.</text><text x="593" y="329" font-size="16" fill="#e7eff8">Uses inherited ES:SI; does not reload the unit pointer.</text><text x="593" y="352" font-size="16" fill="#e7eff8">Tail local ≥301 may enter wizard loop.</text><text x="593" y="375" font-size="16" fill="#e7eff8">First iteration occurs before the count test.</text><path d="M280,395 L280,660" stroke="#7792ad" fill="none" stroke-width="2" marker-end="url(#arrow)"/><path d="M835,395 L835,425" stroke="#7792ad" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="575" y="425" width="515" height="110" rx="10" fill="#1b3044" stroke="#48627c"/><text x="593" y="454" font-size="20" fill="#e7eff8">Each admitted CoM1 iteration</text><text x="593" y="481" font-size="16" fill="#e7eff8">A6BD1 → 97B30 (existing Create_Unit) → 979A2</text><text x="593" y="504" font-size="16" fill="#e7eff8">Actual returned registers, memory, flags and stack remain live.</text><path d="M835,535 L835,565" stroke="#7792ad" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="575" y="565" width="515" height="115" rx="10" fill="#3c3040" stroke="#48627c"/><text x="593" y="594" font-size="20" fill="#e7eff8">CoM1 continuation at B20C6</text><text x="593" y="621" font-size="16" fill="#e7eff8">Local ≥370 + nonzero wizard byte + live DI≠22?</text><text x="593" y="644" font-size="16" fill="#e7eff8">Yes: DI=1A; AX=0; local=0 → external B2C82.</text><text x="593" y="667" font-size="16" fill="#e7eff8">No: rejoin the ordinary clear / return tail.</text><rect x="30" y="660" width="500" height="95" rx="10" fill="#1b3044" stroke="#48627c"/><text x="48" y="689" font-size="20" fill="#e7eff8">MoM ordinary return</text><text x="48" y="716" font-size="16" fill="#e7eff8">Clear 3 wizard words, recomputing each address.</text><text x="48" y="739" font-size="16" fill="#e7eff8">Live-stack epilogue → RETF.</text><path d="M835,680 L835,705" stroke="#7792ad" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="575" y="705" width="515" height="95" rx="10" fill="#1b3044" stroke="#48627c"/><text x="593" y="734" font-size="20" fill="#e7eff8">CoM1 ordinary return</text><text x="593" y="761" font-size="16" fill="#e7eff8">Clear 3 words; reuse second address for the third.</text><text x="593" y="784" font-size="16" fill="#e7eff8">Call 6DA79 → live-stack epilogue → RETF.</text><text x="30" y="830" font-size="17" fill="#e6ba83">Opaque callees and enclosing refresh ownership remain outside this bounded source splice.</text></g></svg>
