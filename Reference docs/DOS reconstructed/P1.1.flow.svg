<text x="810.0" y="734" font-size="17" text-anchor="middle" fill="#182d45">POP DI / SI; SP := BP; POP BP; RETF</text>
<rect x="45" y="487" width="450" height="200" rx="12" fill="#e8edf3" stroke="#99a7b8" stroke-width="1.5"/>
<text x="270.0" y="513" font-size="17" text-anchor="middle" fill="#182d45">Conditions remain explicit</text>
<text x="270.0" y="536" font-size="17" text-anchor="middle" fill="#182d45">• No Holy Weapon test in this exit fragment</text>
<text x="270.0" y="559" font-size="17" text-anchor="middle" fill="#182d45">• Opaque calls may change live state</text>
<text x="270.0" y="582" font-size="17" text-anchor="middle" fill="#182d45">• Pops read the then-current stack</text>
<text x="270.0" y="605" font-size="17" text-anchor="middle" fill="#182d45">• No fixed SP / BP relationship is proved</text>
<text x="270.0" y="628" font-size="17" text-anchor="middle" fill="#182d45">• Rebuild link is not full-pass equivalence</text>
<text x="540" y="804" font-size="17" text-anchor="middle" fill="#182d45">Known caller and DS bindings remain conditions; this is not complete cast admission.</text>
<text x="540" y="833" font-size="15" text-anchor="middle" fill="#182d45">No calculator migration or scheduled-removal feature is introduced by this reconstruction.</text>
