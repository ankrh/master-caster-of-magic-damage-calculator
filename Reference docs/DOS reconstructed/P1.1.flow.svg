<text x="810.0" y="576" font-size="17" text-anchor="middle" fill="#182d45">Existing CoM body: 9ACFE → 99874</text>
<text x="810.0" y="599" font-size="17" text-anchor="middle" fill="#182d45">Post-tested loop over battle-unit slots</text>
<text x="810.0" y="622" font-size="17" text-anchor="middle" fill="#182d45">9988B constructor → 99892 battlefield</text>
<text x="810.0" y="645" font-size="17" text-anchor="middle" fill="#182d45">Reuses existing bodies; no duplicate code</text>
