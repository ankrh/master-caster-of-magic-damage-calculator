[1]
text=This special setup produces trade goods and converts every 2 Production into 1 Gold.
[2]
text=The rate of Population Growth increases, with better terrain supporting more Growth and larger cities experiencing slower increases. Rebels and optional Farmers can further reduce Growth.
[3]
text=Barracks allow a city to train and organize regular military units. Without barracks, a city cannot train regular military units. All units created in the town gain +1 Level.
[4]
text=A Coliseum entertains the population, reducing Unrest by 1 and increasing Fame by 5.
[5]
text=The Fighter's Guild trains soldiers and unlocks superior unit types. Advancing beyond this tier requires casting the Tree of Knowledge spell.
[6]
text=The Armorer's Guild is the height of military technology, training troops in advanced fighting techniques and basic battle tactics, and enabling the construction of more sophisticated units.
[7]
text=A War College serves as a center for teaching battle strategy, tactics, and advanced fighting techniques. All new troops start as Veterans.
[8]
text=A Smithy specializes in producing high-quality weaponry and tools, serving as a key building in any town. It generates 3 Production and is essential for producing most military units.
[9]
text=Stables serve as breeding grounds for mounts used by mounted troops, boosting productivity and generating +4 Production.
[10]
text=The Animist's Guild boosts each Farmer's Food harvest by 2 and increases the healing rate of units within the city by 66%.
[11]
text=A city's Fantastic Stable houses and cares for magical beasts, training them for mounted warfare.
[12]
text=A Dock boosts the economy through overseas trade, generating 1 Food for each ocean or shore tile and 2 Food for each river mouth within the city's range.
[13]
text=A Magic Market supports novice mages practicing witchcraft and selling talismans, generating +4 Magic Power.
[14]
text=A Maritime Guild supports the construction of large ships by providing training, organization, and resources for experienced shipbuilders.
[15]
text=A Mill boosts production by easing farmers' workload, allowing for more efficient activities. It increases base Production by 1, with an additional +0.5 for each Farmer population in the city.
[16]
text=A Library, a repository of knowledge and scholarship, provides +4 Spell Research Points.
[17]
text=The Sage's Guild, dedicated to advanced magical studies and universal understanding, provides +12 Spell Research Points. Advancing beyond this tier requires casting the Tree of Knowledge.
[18]
text=An Oracle provides magical guidance to the city, detecting all enemies within 4 squares and reducing Unrest by 3.
[19]
text=The Alchemist's Guild equips all new troops with magical weapons, granting a +10% To-Hit bonus. It enables the use of Mithril, Nightshade, Adamantium, and Orihalcon in troop production. The building also grants +2 Spell Research Points.
[20]
text=A University, a bastion of education and scholarship, provides +6 Spell Research Points.
[21]
text=The Wizard's Guild is a center for magical study and practice, providing +12 Magic Power and +2 Spell Research Points.
[22]
text=A Shrine provides spiritual solace to the city, adding +2 Religious Power and reducing Unrest by 1.
[23]
text=An Amplifying Tower tunes Aether to facilitate easier spellcasting, increasing Overland Casting Skill by +7.
[24]
text=A Monastery serves as a hub for religious study and teaching, providing +4 Religious Power and reducing Unrest by 1.
[25]
text=A Cathedral establishes the city as a center of worship for the one true divinity, providing 6 Religious Power and reducing Unrest by 2 through unified and focused faith.
[26]
text=A Marketplace serves as a central hub for commerce, making it easier to collect taxes. It generates an additional +7 Gold each turn.
[27]
text=A Bank boosts a town's commercial operations, increasing Gold income from the city by 30%.
[28]
text=The Merchant's Guild is a well-organized hub of prosperity, boosting the city's Gold income by 40%.
[29]
text=A Granary stores the city's food surplus, increasing Max Population by 5 and generating 4 Food.
[30]
text=A Farmer's Market acts as a hub for trading the city's food surplus, accelerating Population Growth by 40 and generating 1 Gold for every two Population Units.
[31]
text=The Forester's Guild trains skilled hunters and lumberjacks, boosting Production by +10% and increasing Food harvest by +4, with an additional +2 for each area of Wild Game near the city.
[32]
text=The City Hall serves as the center of city governance, enabling the construction of advanced knowledge buildings and generating 0.5 Production per worker in the city.
[33]
text=The Mechanician's Guild teaches advanced engineering techniques, enhancing worker productivity and increasing city production by 1.5 units per worker.
[34]
text=The Miner's Guild trains workers in mining techniques, boosting special mineral bonuses by +50% and increasing production by +25%.
[35]
text=A Monument of Magic helps channel magical power across distant lands. It boosts combat casting skill by adding +180 SP to a wizard's skill pool. It can be upgraded to a Linking Tower once the Tree of Knowledge has been activated.
[36]
text=A Linking Tower connects a city to ley lines, allowing magical power to be channeled across vast distances. It enhances combat casting skill by adding +1200 SP to a wizard's skill pool.
[37]
text=Surround the city with a tall brick wall that extends enemy unit detection range to 3 squares. Units behind the wall gain +3 Armor, which reduces to +1 Armor if a wall segment is destroyed.
[38]
text=A Mercenary Camp is an exclusive building that allows all races to recruit units specialized as mercenaries.
[39]
text=An Armory builds upon the basic Smithy, specializing in the production and storage of weapons for wartime use. This expansion of the city's military infrastructure allows for the training of more advanced troops.
[40]
text=A Temple is the center of religious life in the city, providing 4 Religious Power and reducing Unrest by 1. It also grants an extra 2 Religious Power and reduces Unrest by 1 for each Nightshade, Wild Game, and Orihalcon resource available.
[41]
text=Fortifications and a moat grants the city garrison gains +4 Armor in Strategic Combat. In Tactical Combat, friendly units inside the city area receive a Large Shield bonus, and units unable to move on water tiles cannot cross the moat.
[42]
text=A Shipyard brings together skilled craftsmen to construct seaworthy ships for warfare. It can be upgraded to a Maritime Guild after the Tree of Knowledge has been cast.
[43]
text=A Hangar supports the construction and maintenance of flying vessels. Due to people generally don't trust reliability of flying vessels, Hangar needs to be built on the shore to mitigate unfortunate incidents.
[44]
text=A Brewery consumes Food equal to 50% of the Population Unit, plus an additional 25% if the city has a Dock, converting it into Gold at a rate of 3 Gold per unit of Food. It also reduces city Unrest by 1.
[45]
text=The Lava Smelter extracts rare minerals by smelting lava from deep veins. It generates 15 Power and boosts the level of magic weapon upgrades. The city also gains the Wall of Fire. The Lava Smelter must be built on hills or mountains.
[46]
text=The Tree of Life increases population growth by +100 per month, provides food equal to the Max Population unit, and grants Regeneration to all defending units in combat. The Tree of Life must be built in the forest.
[47]
text=The Caravanserai increases Gold income based on the city’s trade bonus. Non-Sailing units trained here gain +2 Overland Movement. Garrison units receive a magical weapon upgrade at the end of turn. The Caravanserai must be built near the desert.
[48]
text=An Undercity Hive Network is an underground settlement and tunnel system beneath the Klackon city. It supports 30% more population capacity but adds +1 Unrest. Defending units can move quickly through the underground tunnels for a tactical advantage.
[49]
text=The Baray generates Gold equal to max population, reduces Unrest by 2, grants Mariner to all newly trained units, turns the city area into water during combat and grants Amphibious to garrison units. The Baray must be built near a river.
[50]
text=A Hillfort is a defensive structure built on an elevated location, offering a strategic advantage. Higher elevation of the city's location, more difficult for the Hillfort to overcome by attackers.
[51]
text=A Warlord's Hold is the revered residence of a great war chief, representing militaristic traditions and warrior pride. It reduces the cost to recruit new units from this city by 25% and doubles the strength of garrison units in reducing Unrest.
[52]
text=A Witches' Convent provides magical protection to the community, generating +4 Religious Power. It has 25% chance to curse enemy units without magic immunity before combat.
[53]
text=The Academy generates research based on max population, halves population decline, increase the figures of Magical Range unit or Fantastic Stable unit by +2, reduces ship and siege unit costs by 25%. The Academy must be built on a hill or mountain.
[54]
text=The Military Workshop enables newly trained and garrison units to utilize blackpowder technology. The Military Workshop must be built near a river.
[55]
text=The Idol of the Heavenly Bull allows each worker unit generates 1 Food and can receive bonuses from the Animist's Guild. Health of all new units trained in the city increases by 25%. The Idol of the Heavenly Bull must be built in the desert.
[56]
text=The Tree of Magic grants newly trained units Casting Skill equal to their base Magical Resistance plus base Magic Range Attack at the moment they are recruited and all Magic Ranged units gain +2 Ammo. The Tree of Magic must be built in the forest.
[57]
text=The Pool of Repentance generates 1 Production for each unit of Farmers, reduces Unrest by 3 as a religious building, and grants new units produced in the city +1 Armor and +1 Resistance. The Pool of Repentance must be built in the forest.
[58]
text=The Dragon Mound grants newly trained units from the city +2 Fire Breath, +1 Armor, and +1 Movement for all flying unit. Additionally, the Dragon Mound increases the city's Gold income by +30%. The Dragon Mound must be built on a hill or mountain.
[59]
text=The Altar of Storm grants the city 8 Religious Power, and all new units trained in the city gain the Lightning Blade ability. In combat, the city is protected by a Lightning Storm. The Altar of Storm must be built on the shore.
[60]
text=The Ludus Agoge is an elite school that trains orc children and enhances them. The City gains +15 Research Points. All trained units gain +1 Attack, +1 Resistance, +1 HP; Legionaries only gain +1 Movement. The Ludus Agoge must be built in the desert.
[61]
text=The Altar of the Sun grants the city 8 Religious Power, +100 Population Growth per turn, and all new units from the city gain +1 Figure. In combat, the city is protected by a High Prayer. The Altar of the Sun must be built on a hill or mountain.
[62]
text=The Altar of the Moon grants the city 8 Religious Power. All new units gain Poison Immunity, Rage, and increases attack power of ranged units. It has 50% chance to deadly curse enemy before combat. The Altar of the Moon must be built in the swamp.
[63]
text=The Frost Club Hall seeks to restore the secrets of the Frost Club clan. Newly trained War Mammoths gain Armor Piercing and +1 Regeneration. Other units gain Cold Immunity and x2 Regeneration strength. The Frost Club Hall must be built in the Tundra.
[64]
text=The Sancta Basilica in the desert provides Religious Power equal to the city's max population unit. Units trained here gain +3 Resistance. Faith-related units become stronger. In combat, the city is blessed by True Light.
[65]
text=The Mother Fungus is a source of motherly love for Goblins. Goblins born under it gain +2 Attack, +10% To-Defend, Poison 1, and x2 Spellcharge. Additionally, it detects all enemies within 10 squares. The Mother Fungus must be built in the swamp.
[66]
text=This city could recruit Tricksters.
[67]
text=This city could recruit Rabblerousers.
[68]
text=This city could recruit Hexers.
[69]
text=This city could recruit Arsonists.
[70]
text=This city could recruit Night Goblins.
[71]
text=This city could recruit Mechaniacs.
[72]
text=This city could recruit Poxbearers.
[73]
text=This city could recruit Gliders.
[74]
text=This city could recruit Spider Riders.
