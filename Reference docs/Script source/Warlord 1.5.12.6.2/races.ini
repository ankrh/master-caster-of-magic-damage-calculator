;Halflings are a peace loving race. Halflings are happy-go-lucky people with no designate enemy. Halflings are excellent farmers and decent workers, but they shun of military life. Halflings are open-minded and curious, producing 1 research per population. Halfling farmers always produce more food. Halflings cities can't build monument, barracks, armorer's guild, and stables. Halfling units, albeit weak, are lucky, which makes them harder to kill.
;They are generally very good at deciphering long lost volumes of text, which lets them grasp new spells faster. Needless to say, they get along well with everyone.
