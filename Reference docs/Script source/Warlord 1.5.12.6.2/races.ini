;Lizardmen are amphibious reptile race. Lizardmen generally believe that they descended from the great lizard. Lizardmen are natural-born mariners but their art and culture are not considered as sophisticate by more civilized races. Lizardmen cannot build Builder's Hall, Fantastic Stables, and Ship Yard. Lizardmen units can move in water, and have +1 health but -1 Resistance. Lizardmen settlers move twice as fast as other races.
;Lizardmen love to travel across oceans and settle in far off spots, which often leads to spreading themselves too thin. Lizardmen inspire hatred among the more advanced races, but get along fine with everyone else.
