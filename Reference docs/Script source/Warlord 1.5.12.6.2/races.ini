;Trolls are newly emerged race of savage creatures. Trolls descend from nature spirit that take shape and trap in physical world due to high magic condensation of Myrror. Troll's culture is lack of sophistication and considered as savage by other races. Trolls as warriors are strong, and tough to beat but the most dangerous thing is that could easily heal themselves from fatal wounds. This make their enemies need to incinderate trolls' remains after battles to make sure they would not raise back to fight again. Trolls can build everything except Builder's Hall, Fantastic Stables, and Maritime Guild. Troll units can regenerate, have higher attack strength and health, but fewer figures and are more expensive.
;Trolls have the weird habit of reforming themselves even after being knocked down, and cure even mortal looking wounds very fast. Thus, most people need to defeat their units completely and burn their remains.
