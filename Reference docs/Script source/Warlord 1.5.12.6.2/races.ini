[11]
;Nomads are race of human roam over desert and grassland of Arcanus. Nomads have sophisticate culture, advanced architectures which rival High Men, expert caravan traders. They are proficient in archery, especially horseback archery, as well as hit-and-run tactics. Children of nomad have been training from young age to resist all temptation and withstand harsh environment with strong will and determination make them hard to be seduced by trickery from magic. Nomad cities receive a +50% trade bonus which increase as nearby cities expand, but cannot build Granaries. Nomad units have +3 resistance. Basic nomad units are equipped with a bow.
;They love practicing archery and generally like to use hit and run tactics in combat, thanks in no small part to their fine horses.
