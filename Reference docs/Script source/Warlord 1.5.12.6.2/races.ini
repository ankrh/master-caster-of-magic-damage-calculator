;Barbarians are militaristic race of noble human warriors which attract little hostility from all but the most haughty races. Barbarians grow fast, and cannot build armorer's guild, fantastic stables, alchemist's guild and builder's hall. Barbarian units use thrown weaponry, have an increased chance to hit, and have pathfinding but 1 lower resistance.
;Barbarians can't build most advanced architecture, however they are good at producing a lot of food, breeding fast, and can build warships.
