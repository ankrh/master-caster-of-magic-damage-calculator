<text x="643" y="496" class="body">Store signed counter div 4 in the frame.</text>
<text x="643" y="519" class="body">Call opaque checkspelleffectrequired at 678A45.</text>
<text x="643" y="542" class="body">Then reread frame value at current EBP.</text>
<text x="643" y="565" class="body">The call may have changed the tested state.</text>
