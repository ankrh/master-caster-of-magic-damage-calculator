<text x="53" y="505" class="head">New outer continuation • 53CB41 onward</text>
<text x="53" y="533" class="body">Two separate live group reads and seven ID heads.</text>
<text x="53" y="556" class="body">With reads 15 / 124, return the current outer result.</text>
<text x="53" y="579" class="body">Earlier tile / visibility / unit conditions still apply.</text>
