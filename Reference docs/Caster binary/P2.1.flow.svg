<text x="53" y="903" class="body">The known effect-handler entry can be modelled</text>
<text x="53" y="926" class="body">with preceding conditions stated explicitly.</text>
<text x="53" y="949" class="body">The opaque renderer call can itself mutate state.</text>
<text x="53" y="972" class="body">This diagram does not establish first/only effect</text>
<text x="53" y="995" class="body">application across the engine animation lifecycle.</text>
