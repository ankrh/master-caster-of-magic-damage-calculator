<text x="53" y="704" class="body">Raw INI records are not runtime-state proof.</text>
<text x="53" y="727" class="body">Returning handlers retain their actual state.</text>
<text x="53" y="750" class="body">Custom routes, initialization and scheduling</text>
<text x="53" y="773" class="body">are not silently assumed away.</text>
<rect x="35" y="846" width="535" height="189" rx="12" fill="#edf0f4" stroke="#a8b5c4"/>
