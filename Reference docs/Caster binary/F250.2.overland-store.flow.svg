<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
<title id="title">Overland cast store: new fragment and reused record mapping</title>
<desc id="desc">The 37-instruction fragment checks a runtime group and converter return, then stores a byte in the base unit's overland enchantment layer. Known record mapping and recalculation are reused. Entry, other branches and the following continuation remain outside the fragment.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#93b9d9"/></marker><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#e6edf3;font-size:16px}.small{font-size:13px;fill:#b5c8d8}.head{font-size:25px;font-weight:600}.box{fill:#17334a;stroke:#527b9b;stroke-width:2}.known{fill:#173c32;stroke:#57977d;stroke-width:2}.open{fill:#3a3020;stroke:#b39562;stroke-width:2;stroke-dasharray:6 5}.line{fill:none;stroke:#93b9d9;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="1080" height="500" fill="#0c1924"/>
<text x="30" y="43" class="head">Overland flags belong to the base unit's overland layer</text>
<text x="30" y="70" class="small">F250.2 • 37 new instructions • 0x5C4CF9–0x5C4D81 • CoM2 and Warlord</text>
<rect x="30" y="105" width="280" height="96" rx="10" class="box"/>
<text x="46" y="132">Runtime group: 1 or 15</text>
<text x="46" y="157" class="small">Spell-slot bound: 0..400</text>
<text x="46" y="181" class="small">Other groups → outside at 0x5C503C</text>
<path d="M310 153H343" class="line"/>
<rect x="352" y="105" width="330" height="96" rx="10" class="box"/>
<text x="369" y="132">Call converter 0x5C2F24</text>
<text x="369" y="157" class="small">Negative return → outside at 0x5C84B5</text>
<text x="369" y="181" class="small">Known converter body reused separately</text>
<path d="M682 153H715" class="line"/>
<rect x="724" y="105" width="326" height="96" rx="10" class="box"/>
<text x="741" y="132">Read target and check indices</text>
<text x="741" y="157" class="small">Target: 1..40000 • flag: 1..100</text>
<text x="741" y="181" class="small">Failure calls remain explicit and opaque</text>
<path d="M887 201V232" class="line"/>
<rect x="352" y="240" width="698" height="86" rx="10" class="box"/>
<text x="371" y="270">0x5C4D79: write byte 1</text>
<text x="371" y="298" class="small">dataBlock + target×0x784 + 0x1AC1D04 + flag   (32-bit address)</text>
<path d="M352 283H320" class="line"/>
<rect x="30" y="240" width="280" height="86" rx="10" class="open"/>
<text x="47" y="270">Continuation outside fragment</text>
<text x="47" y="298" class="small">0x5C4D81 • no final-state claim</text>
<rect x="30" y="365" width="1020" height="105" rx="10" class="known"/>
<text x="48" y="394">Existing evidence supplies the meaning of the address</text>
<text x="48" y="423">BaseUnits.OverlandEnchantmentFlags → copy to Units → aggregate enchantments</text>
<text x="48" y="449" class="small">True Sight: group 1, index 41 in both INIs; runtime loading and preceding cast admission remain conditional.</text>
</svg>
